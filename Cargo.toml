[package]
# NOT PUBLISHED FROM HERE — see `publish` below.
#
# This crate held the `nesql` name on crates.io as a 0.0.1 reservation while the
# real CLI had nowhere to ship from. That is no longer the situation: the CLI is
# a working binary with 88 tests, and it now publishes AS `nesql` from
# Eth-Interchained/nedb, where its source lives.
#
# Two repositories declaring one crate name is not a name conflict — they share
# an owner — it is a RACE. Whichever published last would decide what `cargo add
# nesql` meant, and the answer would change without either repo's history
# showing why. So exactly one of them publishes, and this is not it.
#
# What stays here is the thing this repository is for: the vendored PostgreSQL
# grammar, the NQL grammar, the readable CLI reference, and the constitution in
# README.md.
name = "nesql"
version = "0.0.1"
publish = false
edition = "2021"
rust-version = "1.74"
description = "PostgreSQL's grammar, NEDB's memory — SQL with time travel, bi-temporal validity and causal provenance. Pre-release: name reserved, grammar vendored."
license = "BUSL-1.1"
repository = "https://github.com/Eth-Interchained/neSQL"
homepage = "https://github.com/Eth-Interchained/neSQL"
documentation = "https://docs.rs/nesql"
readme = "README.md"
keywords = ["sql", "postgresql", "database", "temporal", "nedb"]
categories = ["database", "parser-implementations"]
authors = ["Interchained LLC <licensing@interchained.org>"]
# `vendor/**` USED to be excluded, while src/lib.rs told the reader "the
# grammar is vendored (PostgreSQL 17.4 gram.y, licence intact)". Both cannot be
# true: a `cargo add nesql` user got neither the grammar nor an engine, so the
# crate's one substantive claim was false for exactly the people who installed
# it. vendor/ is 696K, the crates.io limit is 10MB, and the claim is worth more
# than the bytes -- so it ships, and COPYRIGHT ships with it.
#
# `reference/` stays out, and that is a statement rather than an oversight: it
# is a COPY of nesql-cli's source and of the grammar, whose source of truth is
# Eth-Interchained/nedb. It exists so onlookers can read the language in the
# repository that bears its name. A crate consumer reads docs.rs and links the
# real crates, so shipping a second copy of someone else's source inside this
# package would only create a staler copy. Read it on GitHub, or regenerate it
# with scripts/sync-reference.sh.
exclude = ["reference/**", "node/**", "python/**", "docs/**", "build/**"]

[lib]
name = "nesql"
path = "src/lib.rs"
