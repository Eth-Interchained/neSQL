[package]
name = "nesql-py"
description = "PyO3 bindings for the nesql CLI crate -> the nesql PyPI wheel."
version = "8.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/Eth-Interchained/neSQL"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
nedb-engine = "8.0.0"
nesql = "8.0.0"
serde_json = { version = "1", features = ["preserve_order"] }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
